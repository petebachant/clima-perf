# Jobs to be done: the user problems CliMA's software and science solve.
#
# Each job groups the packages and CliMA papers (by OpenAlex work ID, from
# data/openalex/clima-pubs.jsonl) that serve it, so analyze-jobs can count
# outside pull per problem rather than per repo. A job needn't have a package:
# some are served so far only by papers, e.g., a method outside authors
# implement themselves. Every tracked repo and every CliMA paper must appear
# exactly once; analyze-jobs fails on a repo that's missing and warns on a
# paper, so new ones get placed here.

jobs:
  ocean-sea-ice:
    name: Ocean and sea-ice modeling
    job: >
      Simulate the ocean and sea ice, from process studies to global
      mesoscale-resolving climate runs, on GPUs.
