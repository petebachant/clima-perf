questions:
  - question: How much has the flagship AMIP simulation sped up since November
      2025?
    evidence:
      - kind: figure
        path: figures/amip-speedup.json
      - kind: result
        path: results/amip-speedup-summary.json
        values:
          baseline_date: baseline_date
          latest_date: latest_date
          latest_speedup: latest_speedup
          recent_median: recent_median_speedup
          peak_speedup: peak_speedup
          peak_date: peak_date
    answer: >
      About {latest_speedup}x. The flagship AMIP benchmark (16 horiz. elem.)
      ran at 1.0x on the {baseline_date} baseline and {latest_speedup}x on
      the latest run ({latest_date}); the recent median is {recent_median}x,
      so the current level is a bit above four times the baseline. The peak
      was {peak_speedup}x on {peak_date}. The gain is a stepwise climb rather
      than a smooth ramp: it roughly doubled by mid-2026 and reached current
      levels when ClimaCore and the coupler picked up the newer layouts and
      timesteppers.
  - question: What is the rate of change of external engagement with CliMA's
      products?
    evidence:
      - kind: figure
        path: figures/external-engagement.json
      - kind: result
        path: results/engagement-summary.json
        values:
          through: last_complete_quarter
          cit_long: citations.long_run_per_year
          cit_recent: citations.recent_per_year
          cit_last: citations.last_year_mean
          cit_prior: citations.prior_year_mean
          ocean_last: github_oceananigans.last_year_mean
          ocean_prior: github_oceananigans.prior_year_mean
          ocean_pct: github_oceananigans.change_pct
          rest_last: github_other_repos.last_year_mean
          rest_prior: github_other_repos.prior_year_mean
          rest_pct: github_other_repos.change_pct
          deps_last: new_dependents.last_year_mean
          deps_prior: new_dependents.prior_year_mean
    answer: >
      Outside engagement is growing only through Oceananigans; the rest is
      flat or shrinking. Outside citations of CliMA papers grew by
      {cit_long} a quarter per year over the whole record but only
      {cit_recent} per year over the last two years: the four quarters
      through {through} averaged {cit_last} a quarter, against {cit_prior}
      the year before. The newest quarters keep gaining citations for months
      as papers are indexed, so they will rise somewhat, but not enough to
      change the picture. On GitHub, outside stars, forks, issues, merged
      PRs, and discussions on Oceananigans changed {ocean_pct:+}% year over
      year ({ocean_prior} to {ocean_last} a quarter), while every other
      CliMA repo combined changed {rest_pct:+}% ({rest_prior} to
      {rest_last}). Outside repos newly listing a CliMA package as a
      dependency, mostly unregistered research code found by GitHub code
      search and led by Oceananigans, averaged {deps_last} a quarter over
      the last year, against {deps_prior} the year before. Code search only
      sees repos that still exist, so older quarters are undercounted.
  - question: How has software development throughput changed over time within
      the CliMA organization?
    evidence:
      - kind: figure
        path: figures/dev-throughput.json
      - kind: result
        path: results/dev-throughput-summary.json
        values:
          pr_first: merged_prs.first_year_mean
          pr_last: merged_prs.last_year_mean
          pr_mult: pr_throughput_multiple
          pr_slope: merged_prs.per_year_slope
          ttm_first: median_ttm_days.first_year_mean
          ttm_last: median_ttm_days.last_year_mean
          rel_first: releases.first_year_mean
          rel_last: releases.last_year_mean
          rel_mult: release_rate_multiple
          n_repos: n_repos_tracked
    answer: >
      Throughput has grown by more than an order of magnitude without the
      review bottleneck getting much worse. Merged pull requests rose from
      {pr_first} per quarter in the first year to {pr_last} per quarter most
      recently, about a {pr_mult}x increase and a steady {pr_slope} PRs per
      year gain across {n_repos} repos. Releases grew even faster, from
      {rel_first} to {rel_last} per quarter ({rel_mult}x). Median
      time-to-merge edged up from {ttm_first} to {ttm_last} days, so the
      typical PR still lands in about a day even as volume exploded; the p90
      tail widened more, reflecting the longer-running PRs that come with a
      larger codebase and heavier CI.
  - question: What clusters of CliMA repos often change together?
    evidence:
      - kind: figure
        path: figures/repo-cochange.json
      - kind: result
        path: results/repo-cochange-summary.json
        values:
          strongest_pair: strongest_pair
          strongest_corr: strongest_corr
          frac_cascade: frac_cascade
          n_dep_updates: n_dep_updates
          n_cascade_updates: n_cascade_updates
          n_upstream: n_upstream_of_climaatmos
      - kind: result
        path: results/example-release-cascade.json
        values:
          example_source: source_repo
          example_date: source_date
          example_downstream: n_downstream_repos
          example_released: n_downstream_repos_that_released
    answer: >
      The tightest correlated pair is {strongest_pair} (r = {strongest_corr}
      over quarterly Project.toml commit counts), but the real cluster is
      the dependency stack itself: ClimaAtmos sits on {n_upstream} tracked
      upstream packages, and the co-change figure shows ClimaCore,
      ClimaParams, Thermodynamics, and ClimaComms as the foundations most
      of the stack links back to, with ClimaAtmos, ClimaLand, and
      ClimaCoupler as the top-level apps that compose them. What holds the
      cluster together is the release cascade rather than independent work:
      {n_cascade_updates} of {n_dep_updates} dependency updates
      ({frac_cascade:.0%}) land within two weeks of a release in another
      package, i.e., a dependent pulls in the new version and re-tags. A
      recent example is the {example_source} release on {example_date},
      which pulled in updates from {example_downstream} downstream packages,
      {example_released} of which then cut their own release.
  - question: >
      How much development speed could be gained by co-locating tightly
      coupled CliMA packages into shared repos, so they could update in a
      single pull request?
    evidence:
      - kind: figure
        path: figures/colocation-saving.json
      - kind: result
        path: results/colocation-saving.json
        values:
          events_per_year: events_per_year
          n_events: n_cascade_events
          frac_mechanical: frac_mechanical
          frac_substantive: frac_substantive
          eliminable_per_year: eliminable_events_per_year
          pr_per_year: pr_propagation_per_year
          n_releases: n_releases
          releases_per_year: releases_per_year
          reactive_releases: n_reactive_releases
          frac_reactive: frac_reactive_releases
          pkgs_with_users: packages_with_external_users
          pkgs_releasing: packages_releasing
          years: years_covered
    answer: >
      The saving is real but modest in PR terms, and the stronger case for
      co-location is against release drudgery rather than PR count. On
      volume: over {years:.1f} years there were {n_events} cascade events
      ({events_per_year:.0f}/year), {frac_mechanical:.0%} of them mechanical
      compat or manifest bookkeeping that a shared repo would absorb, so
      about {eliminable_per_year:.0f} propagation PRs per year eliminated (a
      PR-title cross-check brackets this at {pr_per_year:.0f}/year). That
      alone is not compelling, because those PRs already merge in under a
      day. The per-release ritual is the bigger drag: the tracked packages
      cut {n_releases} releases in that window ({releases_per_year:.0f}/year),
      and {frac_reactive:.0%} of them ({reactive_releases}) are upstream-driven
      -- the version bump, Registrator tag, and downstream propagation exist
      only to keep the version graph consistent, not to ship a feature. Most
      of those releases serve no one outside the org: only {pkgs_with_users}
      of {pkgs_releasing} releasing packages have any external registry
      dependents, while the busiest ones (ClimaAtmos, ClimaCore, ClimaLand)
      each cut around a hundred releases on entirely internal demand. So
      co-location of the low-level stack is best judged as cutting mechanical
      release and propagation overhead for packages with no external users,
      not as a wall-clock or PR-count win; the {frac_substantive:.0%}
      substantive remainder (interface adaptation) would still be work.
  - question: Which packages attract external adopters, and who are they?
    evidence:
      - kind: figure
        path: figures/external-adopters.json
      - kind: result
        path: results/adopters-summary.json
        values:
          n: external_accounts
          top: top_package
          top_n: top_package_accounts
          others: accounts_without_oceananigans
          second: second_package
          second_n: second_package_accounts
          atmos: climaatmos_accounts
          land: climaland_accounts
          coupler: climacoupler_accounts
          known: known_accounts
          acad_pct: academic_pct_of_known
          labs: lab_accounts
          cdr: climate_tech_accounts
          industry: industry_accounts
          oss: open_source_accounts
          unknown: unknown_accounts
          active: active_accounts
    answer: >
      Mostly {top}, and mostly academic ocean scientists. {n} GitHub accounts
      outside CliMA have a public repo listing a CliMA package as a direct
      dependency, and {top_n} of them use {top}. {others} use some other
      CliMA package, led by ones that come with ocean modeling, like
      {second} ({second_n}). The atmosphere and land side of the Earth
      system model has almost no outside users: {atmos} accounts depend on
      ClimaAtmos directly, {land} on ClimaLand, and {coupler} on
      ClimaCoupler. Of the {known} accounts whose profiles say who they
      are, {acad_pct}% are academic, then {labs} research labs or
      government, {cdr} climate tech or carbon removal groups, {oss}
      open-source projects, and {industry} companies; {unknown} more give no
      affiliation. {active} of the {n} pushed to a repo using a CliMA
      package in the last 180 days. Code search only sees public repos'
      default branches, so private use, including any by companies, is
      invisible here.
  - question: Which job to be done is likely to be CliMA's next big product,
      like Oceananigans?
    evidence:
      - kind: figure
        path: figures/job-scorecard.json
      - kind: figure
        path: figures/job-funnel.json
      - kind: result
        path: results/jobs-summary.json
        values:
          top: top_job
          top_share: top_job_deep_share_pct
          ocean_users: ocean_sea_ice_users
          ocean_contrib: ocean_sea_ice_contributors
          ocean_deep: ocean_sea_ice_deep_pct
          cal_deep: calibration_uq_deep_pct
          best: best_ratio_job
          best_ratio: best_ratio
          top_ratio: top_ratio
          most_cited: most_cited_job
          most_cited_n: most_cited_n
          ocean_cites: ocean_sea_ice_citations_2y
          fastest: fastest_cited_job
          fastest_pct: fastest_cited_pct
          fastest_prior: fastest_cited_prior_year
          fastest_last: fastest_cited_last_year
          ml_cites: ml_closures_citations_2y
          esm_pr_pct: esm_pr_pct
          esm_users: esm_users
    answer: >
      No other job has a funnel like Oceananigans' yet, but a few show
      pull of other kinds. {top} accounts for {top_share}% of the outside
      accounts that use or contribute to any job's packages, with
      {ocean_users} users and {ocean_contrib} contributors. It doesn't
      convert better than the others: {ocean_deep}% of the outside accounts
      it reaches become users or contributors, against {cal_deep}% for
      calibration and UQ. What sets it apart is how many people it reaches.
      Of the rest, {best} has the most outside users per CliMA PR
      ({best_ratio} per 100, against {top_ratio} for ocean). The job with
      the most outside citations is {most_cited}, with {most_cited_n} in
      two years against {ocean_cites} for ocean. {fastest} has the
      fastest-growing outside citations, up {fastest_pct}% in the last year
      ({fastest_prior} to {fastest_last}), with no CliMA package serving it
      yet; ML closures and model error ({ml_cites} citations) is the same
      kind of paper-only job. Atmosphere and coupled Earth system modeling
      take {esm_pr_pct}% of CliMA members' merged PRs and account for
      {esm_users} of the outside users found. These measure outside pull
      only. They can't weigh jobs CliMA's strategy needs regardless, like a
      full Earth system model, whose value may come through the science and
      projections it produces rather than outside adoption, so they rank
      candidates rather than pick one.
