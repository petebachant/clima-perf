owner: petebachant
name: clima-perf
title: CliMA performance
description: Tracking CliMA performance over time.
git_repo_url: https://github.com/petebachant/clima-perf

requirements:
  - pixi
  - kind: setup
    name: GitHub CLI access
    check_command: calkit xenv -n clima-data -- gh auth status
    setup_command: calkit xenv -n clima-data -- gh auth login
    description: >
      The fetch-github stage uses the gh CLI to pull data from CliMA org
      repos. Run this once locally to authenticate. On GitHub Actions the
      run-pipeline workflow sets GH_TOKEN from the workflow's GITHUB_TOKEN,
      so no interactive login is needed there.
  - kind: env-var
    name: BUILDKITE_PAT
    description: Buildkite personal access token.

environments:
  main:
    path: envs/main.txt
    kind: uv-venv
    prefix: .calkit/venvs/main/.venv
    python: "3.14"
  analyze:
    path: envs/analyze.txt
    kind: uv-venv
    prefix: .calkit/venvs/analyze/.venv
    python: "3.14"
  bk:
    path: envs/bk.txt
    kind: uv-venv
    prefix: .calkit/venvs/bk/.venv
    python: "3.14"
  clima-data:
    # Pixi env (under .calkit/envs/) with gh + jq + python so both
    # fetch-github.py (subprocess gh) and fetch-citations.py (requests +
    # pyyaml) run in one environment.
    kind: pixi
    path: .calkit/envs/clima-data/pixi.toml
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_setup:
      - module purge
      - module load climacommon/2025_05_15
    default_options:
      - --gpus=1
      - --time=120

pipeline:
  stages:
    benchmark-amip:
      frozen: true # Was run in a previous form; no need to run again
      kind: python-script
      environment: clima:main
      scheduler:
        log_path: runs/amip/{date}/output.log
      script_path: scripts/run.py
      args:
        - --date="{date}"
      inputs:
        - repos/ClimaCoupler.jl/toml/amip_progedmf_1m.toml
        - repos/ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - repos/ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      outputs:
        - path: runs/amip/{date}/Manifest-v1.11.toml
          storage: git
          delete_before_run: true
        - path: runs/amip/{date}/repo-revs.json
          storage: git
          delete_before_run: true
      iterate_over:
        - arg_name: date
          values:
            # - "2025-10-15" # Fails
            - "2025-11-01"
            - "2025-11-02"
            - "2025-11-03"
            - "2025-11-04"
            # - "2025-11-07" # Fails
            # - "2025-11-14" # Fails
            # - "2025-12-01" # Fails
            - "2025-12-06"
            - "2025-12-20"
            - "2025-12-27"
            # - "2026-01-01" # Fails
            # - "2026-01-06" # Fails
            - "2026-01-13"
    fetch-buildkite:
      kind: jupyter-notebook
      environment: bk
      notebook_path: notebooks/buildkite.ipynb
      always_run: true
      html_storage: git
      executed_ipynb_storage: git
      outputs:
        - path: buildkite
          delete_before_run: false
          storage: git
    fetch-weekly-buildkite:
      description: >
        Mirror job metadata and raw logs for the weekly CliMA benchmark
        Buildkite pipelines: the three ClimaCoupler ones that report into
        the CliMA Slack #coupler-report channel (climacoupler-amip,
        climacoupler-longruns, climacoupler-cpu-gpu-benchmarks) plus
        climaland-long-runs. Buildkite ages logs out, so this keeps a copy
        while they still exist. Jobs already mirrored are skipped, so
        re-running is cheap; pass a larger --max-builds to backfill.
        Metrics are parsed downstream in analyze-weekly, not here, so a
        parser fix can be applied to history.
      kind: python-script
      script_path: scripts/fetch-weekly-buildkite.py
      environment: bk
      always_run: true
      outputs:
        - path: data/buildkite-weekly
          delete_before_run: false
          storage: git
    fetch-github:
      description: >
        Incrementally fetch CliMA-org GitHub data (PRs, issues, repo stats,
        forks, releases, Project.toml commits, repo creation dates) up to
        the start of the current UTC day. Resumes from the latest
        previously-fetched timestamp on each run.
      kind: python-script
      script_path: scripts/fetch-github.py
      environment: clima-data
      always_run: true
      outputs:
        - path: data/github
          storage: git
          delete_before_run: false
    fetch-registry:
      description: >
        Clone JuliaRegistries/General and update a single dependents.jsonl
        event log per (clima_package, dependent) pair, tracking
        first_seen_at + last_seen_at. First run does a full-history clone
        and backfills first_seen_at from git log; subsequent runs use a
        shallow clone. No-ops if today's UTC day has already been processed.
      kind: python-script
      script_path: scripts/fetch-registry.py
      environment: clima-data
      always_run: true
      outputs:
        - path: data/julia-registry
          storage: git
          delete_before_run: false
    fetch-citations:
      description: >
        Parse every entry on https://clima.caltech.edu/publications/, resolve
        each to an OpenAlex work (DOI lookup or title+year search), and
        snapshot the citation graph as four normalized JSONL tables
        (clima-pubs, citing-pubs, citations, authors) under data/openalex/.
        No-ops once the marker records the current UTC day. Internal-vs-
        external classification and package grouping happen in the analyze
        notebook.
      kind: python-script
      script_path: scripts/fetch-citations.py
      environment: clima-data
      always_run: true
      outputs:
        - path: data/openalex
          storage: git
          delete_before_run: false
    analyze:
      kind: jupyter-notebook
      environment: analyze
      notebook_path: notebooks/analyze.ipynb
      html_storage: git
      executed_ipynb_storage: git
      inputs:
        - runs/amip
        - buildkite
        - data/github
        - data/openalex
        - data/julia-registry
      outputs:
        - path: results/amip.csv
          storage: git
        - path: results/amip-repo-diff-links.md
          storage: git
        - path: figures/amip-speedup.json
          storage: git
        - path: figures/external-engagement.json
          storage: git
        - path: results/external-citations.csv
          storage: git
        - path: results/github-engagement.csv
          storage: git
        - path: results/new-registry-dependents.csv
          storage: git
    analyze-dev-speed:
      description: Analyze things like PR resolution speed to see changes over
        time.
      kind: jupyter-notebook
      notebook_path: notebooks/analyze-dev-speed.ipynb
      environment: analyze
      html_storage: git
      executed_ipynb_storage: git
      inputs:
        - data/github
      outputs:
        - path: results/dev-throughput.csv
          storage: git
        - path: figures/dev-throughput.json
          storage: git
    analyze-weekly:
      description: >
        Parse the mirrored weekly Buildkite logs into a table of scalar
        metrics (SYPD, walltime per coupling step, how far each run got
        before finishing or crashing, crash signature) and plot them over
        time.
      kind: jupyter-notebook
      notebook_path: notebooks/analyze-weekly.ipynb
      environment: analyze
      html_storage: git
      executed_ipynb_storage: git
      inputs:
        - from_stage_outputs: fetch-weekly-buildkite
      outputs:
        - path: results/weekly-benchmarks.csv
          storage: git
        - path: figures/weekly-benchmarks.json
          storage: git
    analyze-repo-changes:
      description: >
        Work out which clusters of CliMA packages change together, from the
        Project.toml commit history. Builds a layered dependency graph (an
        edge is read from commit messages that name the package that
        changed, e.g. "use ClimaCore v0.14.46"), a per-quarter co-change
        correlation of each package's commit counts, and the fraction of
        dependency updates that follow a release in another package within
        two weeks. Writes figures/repo-cochange.json and
        results/repo-cochange.csv.
      kind: python-script
      script_path: scripts/analyze-repo-changes.py
      environment: analyze
      inputs:
        - data/github
        - scripts/projecttoml-graph.py
      outputs:
        - path: results/repo-cochange.csv
          storage: git
        - path: results/repo-cochange-summary.json
          storage: git
        - path: figures/repo-cochange.json
          storage: git
    example-release-cascade:
      description: >
        Trace one concrete release cascade from the Project.toml history:
        the release with the widest downstream fan-out in the last two
        years, the dependency updates it triggered, and which of those
        packages then cut their own release. Writes
        results/example-release-cascade.json.
      kind: python-script
      script_path: scripts/example-release-cascade.py
      environment: analyze
      inputs:
        - data/github
        - scripts/projecttoml-graph.py
      outputs:
        - path: results/example-release-cascade.json
          storage: git
    estimate-colocation-saving:
      description: >
        Estimate how much dependency-propagation work co-locating tightly
        coupled packages into shared repos could remove. Counts cascade
        events (a dependency update following a release in another package
        within two weeks), splits them into mechanical compat/manifest
        bookkeeping versus substantive adaptation, and reports the
        mechanical share per year and per repo. Volume only: dependency
        updates already merge in well under a day, so the saving is in
        eliminated CI and review cycles, not wall-clock latency.
      kind: python-script
      script_path: scripts/estimate-colocation-saving.py
      environment: analyze
      inputs:
        - data/github
        - scripts/projecttoml-graph.py
      outputs:
        - path: results/colocation-saving.json
          storage: git
        - path: results/colocation-by-repo.csv
          storage: git
        - path: figures/colocation-saving.json
          storage: git

figures:
  - path: figures/amip-speedup.json
    title: Flagship AMIP speedup
    description: Flagship AMIP benchmark (16 horiz. elem.) SYPD over time
      normalized by the start of performance tracking.
    stage: analyze
  - path: figures/external-engagement.json
    title: External engagement
    description: External engagement with CliMA's products on a quarterly basis.
    stage: analyze
  - path: figures/weekly-benchmarks.json
    title: Weekly benchmarks
    stage: analyze-weekly
    description: >
      Scalar metrics over time for the weekly ClimaCoupler and ClimaLand
      benchmark runs. One trace per active configuration. Panels are throughput (SYPD),
      the fraction of
      the configured run length actually simulated (crosses mark jobs that
      did not pass, so a low value reads as a crash), and job wallclock.
  - path: figures/dev-throughput.json
    title: Software development throughput
    stage: analyze-dev-speed
    description: Quarterly development throughput across CliMA's ecosystem. Pull
      request time-to-merge (p50 and p90), PR merge rate, and release rate.
      There is one trace per repository; the thick gray line is the
      ecosystem-wide value (normalized to a per-repo average on the count-based
      panels).
  - path: figures/repo-cochange.json
    title: Repo co-change clusters
    stage: analyze-repo-changes
    description: >
      Which CliMA packages change together, as a Sankey dependency graph
      built from Project.toml commit messages. Dependents are on the left
      and their dependencies on the right, with link width by how much
      evidence the history gives for that link. Package-level thresholds
      and timings behind it are in results/repo-cochange.csv.
  - path: figures/colocation-saving.json
    title: Release burden and reach by repo
    stage: estimate-colocation-saving
    description: >
      Releases per repo since it was first tagged, with the upstream-driven
      (reactive) share overlaid and the number of external Julia-registry
      dependents annotated at the right. Shows which packages carry the
      release/Registrator/propagation burden and how many users outside
      CliMA that burden actually serves.

notebooks:
  - path: notebooks/analyze.ipynb
    title: Analysis
    description: Analyze and plot the flagship AMIP benchmark (16 horiz. elem.)
      SYPD over time.
    stage: analyze
  - path: notebooks/analyze-weekly.ipynb
    title: Weekly benchmark analysis
    description: >
      Parse the mirrored weekly ClimaCoupler and ClimaLand Buildkite logs
      and plot SYPD, run length before crash, and wallclock over time.
    stage: analyze-weekly
  - path: notebooks/buildkite.ipynb
    title: Fetch Buildkite jobs from their API
    description: Fetch Buildkite benchmark data for comparison.
    stage: fetch-buildkite
  - path: notebooks/main.ipynb
    title: Main dev notebook
    description: This was used to develop the run.py script.
    environment: main

showcase:
  - figure: figures/amip-speedup.json
  - markdown_file: results/amip-repo-diff-links.md

datasets:
  - path: results/amip.csv
    title: Flagship AMIP benchmark results
    description: Results from the flagship AMIP benchmark (16 horiz. elem.) over
      time.
    stage: analyze
  - path: results/external-citations.csv
    title: External citation events
    description: One row per external citing work (OpenAlex), tagged with the
      cited CliMA paper's DOI + software package (if any) and the citing work's
      quarter. Internal self-citations (any author shared with any scraped CliMA
      paper) are excluded.
    stage: analyze
  - path: results/github-engagement.csv
    title: GitHub engagement events
    description: One row per external star / fork / opened issue / merged PR
      (login is non-CliMA-org, non-bot), with repo, event type, login,
      timestamp, and quarter.
    stage: analyze
  - path: results/new-registry-dependents.csv
    title: New external Julia-registry dependents
    description: One row per (CliMA package, external dependent) pair, with the
      dependent's repo URL and the quarter when it first appeared in the Julia
      General registry as a dependent.
    stage: analyze
  - path: buildkite
    title: Buildkite flagship AMIP jobs
    description: Job info and raw logs from Buildkite for the flagship AMIP
      benchmark.
    stage: fetch-buildkite
  - path: data/buildkite-weekly
    title: Weekly benchmark Buildkite jobs
    description: >
      Job info and raw logs from the weekly ClimaCoupler and ClimaLand
      Buildkite benchmark pipelines, mirrored before Buildkite's retention
      window removes them. One JSON file per job, named by build number and
      job ID.
    stage: fetch-weekly-buildkite
  - path: results/weekly-benchmarks.csv
    title: Weekly benchmark metrics
    description: >
      One row per weekly benchmark job, with the configuration it ran
      (run name, h_elem, dt, t_end), its throughput (SYPD, walltime per
      coupling step), how far it got before finishing or crashing, and its
      crash signature if it failed.
    stage: analyze-weekly
  - path: runs/amip
    title: Raw AMIP benchmark runs
    description: Raw outputs (logs, manifests, repo revisions used) from the
      flagship AMIP benchmark runs.
    stage: benchmark-amip
  - path: results/dev-throughput.csv
    title: Software development throughput
    description: One row per (repo, quarter) plus an "All repos" aggregate, with
      merged-PR count, p50/p90 time-to-merge, and release count across CliMA's
      GitHub repos.
    stage: analyze-dev-speed
  - path: results/repo-cochange.csv
    title: Repo co-change counts
    description: One row per (repo, quarter), splitting Project.toml commits
      into release version bumps and dependency updates (compat or manifest
      changes), used to measure how clusters of CliMA packages move together.
    stage: analyze-repo-changes
  - path: results/repo-cochange-summary.json
    title: Repo co-change summary
    description: >
      Summary statistics for the repo co-change question: the strongest
      correlated package pair, the share of dependency updates that follow a
      release in another package within two weeks, and ClimaAtmos's upstream
      dependencies.
    stage: analyze-repo-changes
  - path: results/example-release-cascade.json
    title: Example release cascade
    description: >
      One concrete release cascade from the Project.toml history: the
      release with the widest downstream fan-out in the last two years, the
      dependency updates it triggered, and which downstream packages then cut
      their own release.
    stage: example-release-cascade
  - path: results/colocation-saving.json
    title: Co-location saving estimate
    description: >
      Volume estimate of the dependency-propagation work co-locating
      tightly coupled packages could remove: cascade events per year, the
      mechanical (absorbed) versus substantive (still-work) split, release
      counts and the upstream-driven share, and how many packages have any
      external registry dependents. Explicitly a volume, not wall-clock,
      estimate.
    stage: estimate-colocation-saving
  - path: results/colocation-by-repo.csv
    title: Release and propagation burden by repo
    description: >
      One row per repo, with cascade events and their mechanical subset,
      total and upstream-driven release counts, and external registry
      dependents, over the 2021-Q2 to 2026-Q3 window. Ranks the packages
      where co-locating coupled deps would remove the most ceremony.
    stage: estimate-colocation-saving
questions:
  - question: How much has the flagship AMIP simulation sped up since November
      2025?
    evidence:
      - kind: figure
        path: figures/amip-speedup.json
  - question: What is the rate of change of external engagement with CliMA's
      products?
    evidence:
      - kind: figure
        path: figures/external-engagement.json
  - question: How has software development throughput changed over time within
      the CliMA organization?
    evidence:
      - kind: figure
        path: figures/dev-throughput.json
  - question: What clusters of CliMA repos often change together?
    evidence:
      - kind: figure
        path: figures/repo-cochange.json
      - kind: result
        path: results/repo-cochange-summary.json
        values:
          strongest_pair: strongest_pair
          strongest_corr: strongest_corr
          frac_cascade: frac_cascade
          n_dep_updates: n_dep_updates
          n_cascade_updates: n_cascade_updates
          n_upstream: n_upstream_of_climaatmos
      - kind: result
        path: results/example-release-cascade.json
        values:
          example_source: source_repo
          example_date: source_date
          example_downstream: n_downstream_repos
          example_released: n_downstream_repos_that_released
    answer: >
      The tightest correlated pair is {strongest_pair} (r = {strongest_corr}
      over quarterly Project.toml commit counts), but the real cluster is
      the dependency stack itself: ClimaAtmos sits on {n_upstream} tracked
      upstream packages, and the co-change figure shows ClimaCore,
      ClimaParams, Thermodynamics, and ClimaComms as the foundations most
      of the stack links back to, with ClimaAtmos, ClimaLand, and
      ClimaCoupler as the top-level apps that compose them. What holds the
      cluster together is the release cascade rather than independent work:
      {n_cascade_updates} of {n_dep_updates} dependency updates
      ({frac_cascade:.0%}) land within two weeks of a release in another
      package, i.e., a dependent pulls in the new version and re-tags. A
      recent example is the {example_source} release on {example_date},
      which pulled in updates from {example_downstream} downstream packages,
      {example_released} of which then cut their own release.
  - question: >
      How much development speed could be gained by co-locating tightly
      coupled CliMA packages into shared repos, so they could update in a
      single pull request?
    evidence:
      - kind: figure
        path: figures/colocation-saving.json
      - kind: result
        path: results/colocation-saving.json
        values:
          events_per_year: events_per_year
          n_events: n_cascade_events
          frac_mechanical: frac_mechanical
          frac_substantive: frac_substantive
          eliminable_per_year: eliminable_events_per_year
          pr_per_year: pr_propagation_per_year
          n_releases: n_releases
          releases_per_year: releases_per_year
          reactive_releases: n_reactive_releases
          frac_reactive: frac_reactive_releases
          pkgs_with_users: packages_with_external_users
          pkgs_releasing: packages_releasing
          years: years_covered
    answer: >
      The saving is real but modest in PR terms, and the stronger case for
      co-location is against release drudgery rather than PR count. On
      volume: over {years:.1f} years there were {n_events} cascade events
      ({events_per_year:.0f}/year), {frac_mechanical:.0%} of them mechanical
      compat or manifest bookkeeping that a shared repo would absorb, so
      about {eliminable_per_year:.0f} propagation PRs per year eliminated (a
      PR-title cross-check brackets this at {pr_per_year:.0f}/year). That
      alone is not compelling, because those PRs already merge in under a
      day. The per-release ritual is the bigger drag: the tracked packages
      cut {n_releases} releases in that window ({releases_per_year:.0f}/year),
      and {frac_reactive:.0%} of them ({reactive_releases}) are upstream-driven
      -- the version bump, Registrator tag, and downstream propagation exist
      only to keep the version graph consistent, not to ship a feature. Most
      of those releases serve no one outside the org: only {pkgs_with_users}
      of {pkgs_releasing} releasing packages have any external registry
      dependents, while the busiest ones (ClimaAtmos, ClimaCore, ClimaLand)
      each cut around a hundred releases on entirely internal demand. So
      co-location of the low-level stack is best judged as cutting mechanical
      release and propagation overhead for packages with no external users,
      not as a wall-clock or PR-count win; the {frac_substantive:.0%}
      substantive remainder (interface adaptation) would still be work.
