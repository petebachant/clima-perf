owner: petebachant
name: clima-perf
title: CliMA performance
description: Tracking CliMA performance over time.
git_repo_url: https://github.com/petebachant/clima-perf

requirements:
  - pixi
  - kind: setup
    name: GitHub CLI access
    check_command: calkit xenv -n clima-data -- gh auth status
    setup_command: calkit xenv -n clima-data -- gh auth login
    description: >
      The fetch-github stage uses the gh CLI to pull data from CliMA org
      repos. Run this once locally to authenticate. On GitHub Actions the
      run-pipeline workflow sets GH_TOKEN from the CLIMA_GH_TOKEN secret, a
      personal token with push access to the CliMA repos, since the
      workflow's own GITHUB_TOKEN can't list stargazers or read traffic
      stats there.
  - kind: env-var
    name: BUILDKITE_PAT
    description: Buildkite personal access token.
  - kind: env-var
    name: OPENALEX_API_KEY
    description: >
      OpenAlex API key for the fetch-citations stage. Without one, requests
      share a small free daily budget per IP address, and OpenAlex rejects
      paged requests (HTTP 401) once it runs out, which truncates citation
      lists for heavily cited papers. Get a free key at
      https://openalex.org/settings/api. In CI it comes from the
      OPENALEX_API_KEY repository secret.

environments:
  main:
    path: envs/main.txt
    kind: uv-venv
    prefix: .calkit/venvs/main/.venv
    python: "3.14"
  analyze:
    path: envs/analyze.txt
    kind: uv-venv
    prefix: .calkit/venvs/analyze/.venv
    python: "3.14"
  bk:
    path: envs/bk.txt
    kind: uv-venv
    prefix: .calkit/venvs/bk/.venv
    python: "3.14"
  clima-data:
    # Pixi env (under .calkit/envs/) with gh + jq + python so both
    # fetch-github.py (subprocess gh) and fetch-citations.py (requests +
    # pyyaml) run in one environment.
    kind: pixi
    path: .calkit/envs/clima-data/pixi.toml
  clima:
    kind: slurm
    host: clima.gps.caltech.edu
    default_setup:
      - module purge
      - module load climacommon/2025_05_15
    default_options:
      - --gpus=1
      - --time=120

pipeline:
  stages:
    benchmark-amip:
      frozen: true # Was run in a previous form; no need to run again
      kind: python-script
      environment: clima:main
      scheduler:
        log_path: runs/amip/{date}/output.log
      script_path: scripts/run.py
      args:
        - --date="{date}"
      inputs:
        - repos/ClimaCoupler.jl/toml/amip_progedmf_1m.toml
        - repos/ClimaCoupler.jl/config/atmos_configs/climaatmos_progedmf_1m.yml
        - repos/ClimaCoupler.jl/config/benchmark_configs/amip_progedmf_1m_land_he16.yml
      outputs:
        - path: runs/amip/{date}/Manifest-v1.11.toml
          storage: git
          delete_before_run: true
        - path: runs/amip/{date}/repo-revs.json
          storage: git
          delete_before_run: true
      iterate_over:
        - arg_name: date
          values:
            # - "2025-10-15" # Fails
            - "2025-11-01"
            - "2025-11-02"
            - "2025-11-03"
            - "2025-11-04"
            # - "2025-11-07" # Fails
            # - "2025-11-14" # Fails
            # - "2025-12-01" # Fails
            - "2025-12-06"
            - "2025-12-20"
            - "2025-12-27"
            # - "2026-01-01" # Fails
            # - "2026-01-06" # Fails
            - "2026-01-13"
    fetch-buildkite:
      kind: jupyter-notebook
      environment: bk
      notebook_path: notebooks/buildkite.ipynb
      inputs:
        - kind: schedule
          period: 1 day
      html_storage: git
      executed_ipynb_storage: git
      outputs:
        - path: buildkite
          delete_before_run: false
          storage: git
    fetch-weekly-buildkite:
      description: >
        Mirror job metadata and raw logs for the weekly CliMA benchmark
        Buildkite pipelines: the three ClimaCoupler ones that report into
        the CliMA Slack #coupler-report channel (climacoupler-amip,
        climacoupler-longruns, climacoupler-cpu-gpu-benchmarks) plus
        climaland-long-runs. Buildkite ages logs out, so this keeps a copy
        while they still exist. Jobs already mirrored are skipped, so
        re-running is cheap; pass a larger --max-builds to backfill.
        Metrics are parsed downstream in analyze-weekly, not here, so a
        parser fix can be applied to history.
      kind: python-script
      script_path: scripts/fetch-weekly-buildkite.py
      environment: bk
      inputs:
        - kind: schedule
          period: 1 day
      outputs:
        - path: data/buildkite-weekly
          delete_before_run: false
          storage: git
    fetch-github:
      description: >
        Incrementally fetch CliMA-org GitHub data (PRs, issues, repo stats,
        forks, releases, Project.toml commits, repo creation dates) up to
        the start of the current UTC day. Runs once per UTC day and resumes
        from the latest previously-fetched timestamp.
      kind: python-script
      script_path: scripts/fetch-github.py
      environment: clima-data
      inputs:
        - kind: schedule
          period: 1 day
        - scripts/period.py
        - scripts/clima_repos.py
      outputs:
        - path: data/github
          storage: git
          delete_before_run: false
    fetch-registry:
      description: >
        Clone JuliaRegistries/General and update a single dependents.jsonl
        event log per (clima_package, dependent) pair, tracking
        first_seen_at + last_seen_at. Matches CliMA packages by UUID in
        both Deps.toml and WeakDeps.toml (package extensions), counting
        CLIMAParameters as ClimaParams. When what's tracked changes, it does
        a full-history clone and backfills first_seen_at for the newly
        tracked dependents from git log; otherwise a shallow clone. Runs
        once per UTC day.
      kind: python-script
      script_path: scripts/fetch-registry.py
      environment: clima-data
      inputs:
        - kind: schedule
          period: 1 day
        - scripts/period.py
        - scripts/clima_repos.py
      outputs:
        - path: data/julia-registry
          storage: git
          delete_before_run: false
    fetch-citations:
      description: >
        Parse every entry on https://clima.caltech.edu/publications/, resolve
        each to an OpenAlex work (DOI lookup, a hand-picked ID from
        data/openalex-overrides.csv, title+year search, or the ID resolved
        on an earlier run, which follows OpenAlex merges), and
        snapshot the citation graph as four normalized JSONL tables
        (clima-pubs, citing-pubs, citations, authors) under data/openalex/.
        Runs once per UTC day. Internal-vs-external classification and
        package grouping happen in analyze-engagement.
      kind: python-script
      script_path: scripts/fetch-citations.py
      environment: clima-data
      inputs:
        - kind: schedule
          period: 1 day
        - data/openalex-overrides.csv
      outputs:
        - path: data/openalex
          storage: git
          delete_before_run: false
    fetch-code-dependents:
      description: >
        Search GitHub code for each CliMA package's UUID in Project.toml
        files to find repos that depend on it directly, including ones that
        aren't registered packages. Keeps a first/last-seen log of hits plus
        each repo's metadata and its owner's public profile. Code search is
        slow (10 requests a minute), so this runs weekly.
      kind: python-script
      script_path: scripts/fetch-code-dependents.py
      environment: clima-data
      inputs:
        - kind: schedule
          period: 1 week
        - scripts/period.py
        - data/julia-downloads/packages.csv
      outputs:
        - path: data/github-code-dependents
          storage: git
          delete_before_run: false
    fetch-blog:
      description: >
        Fetch every post on the clima.caltech.edu blog from its WordPress
        API: date, title, link, the packages its title names, and the CliMA
        repos it links to.
      kind: python-script
      script_path: scripts/fetch-blog.py
      environment: clima-data
      inputs:
        - kind: schedule
          period: 1 day
      outputs:
        - path: data/blog
          storage: git
          delete_before_run: false
    fetch-github-traffic:
      description: >
        Snapshot GitHub traffic (daily views and clones, plus top referrers
        and pages over the last 14 days) for the CliMA repos fetch-github
        tracks. GitHub keeps only 14 days, so this runs daily and
        accumulates it. Needs a token with push access to the repos.
      kind: python-script
      script_path: scripts/fetch-github-traffic.py
      environment: clima-data
      inputs:
        - kind: schedule
          period: 1 day
        - scripts/period.py
        - scripts/clima_repos.py
      outputs:
        - path: data/github-traffic
          storage: git
          delete_before_run: false
    fetch-julia-downloads:
      description: >
        Snapshot Julia package-server download stats (unique IPs and
        requests per day, by client type and region) for CliMA's registered
        packages plus a few peers. The servers publish only about the last
        31 days, so this runs daily and accumulates them.
      kind: python-script
      script_path: scripts/fetch-julia-downloads.py
      environment: clima-data
      inputs:
        - kind: schedule
          period: 1 day
        - scripts/period.py
        - scripts/clima_repos.py
      outputs:
        - path: data/julia-downloads
          storage: git
          delete_before_run: false
    analyze:
      kind: jupyter-notebook
      environment: analyze
      notebook_path: notebooks/analyze.ipynb
      html_storage: git
      executed_ipynb_storage: git
      inputs:
        - runs/amip
        - buildkite
      outputs:
        - path: results/amip.csv
          storage: git
        - path: results/amip-repo-diff-links.md
          storage: git
        - path: figures/amip-speedup.json
          storage: git
    analyze-engagement:
      description: >
        Count external engagement with CliMA's products per quarter: paper
        citations, GitHub stars, forks, issues, merged PRs, and discussions,
        and outside repos newly depending on a CliMA package (Julia
        registry or GitHub code search), excluding CliMA's own people,
        spin-offs run by CliMA developers, copies, and bots.
        Writes one event table per stream and
        figures/external-engagement.json (quarterly), plus monthly and weekly
        variants.
      kind: python-script
      script_path: scripts/analyze-engagement.py
      environment: analyze
      inputs:
        - scripts/repo_colors.py
        - scripts/clima_repos.py
        - data/github
        - data/openalex
        - data/julia-registry
        - data/github-code-dependents
        - results/adopter-accounts.csv
      outputs:
        - path: figures/external-engagement.json
          storage: git
        - path: figures/external-engagement-monthly.json
          storage: git
        - path: figures/github-engagement-weekly.json
          storage: git
        - path: results/external-citations.csv
          storage: git
        - path: results/github-engagement.csv
          storage: git
        - path: results/new-dependents.csv
          storage: git
    analyze-blog:
      description: >
        For each post in the blog's package series (since 2026-07-28) that
        names a tracked package, compare the package's external GitHub
        events (stars, forks, issues, merged PRs, discussions) in the 28
        days from the post to the count its rate over the prior 90 days
        predicts.
      kind: python-script
      script_path: scripts/analyze-blog.py
      environment: analyze
      inputs:
        - data/blog
        - results/github-engagement.csv
        - data/github/repo_stats
        - scripts/clima_repos.py
      outputs:
        - path: results/blog-post-engagement.csv
          storage: git
        - path: figures/blog-post-engagement.json
          storage: git
    analyze-adopters:
      description: >
        Count the GitHub accounts outside CliMA that list each CliMA package
        as a direct dependency (from code search and the Julia registry),
        label each account by segment from its public profile or
        data/adopter-labels.csv, and flag which are still active.
      kind: python-script
      script_path: scripts/analyze-adopters.py
      environment: analyze
      inputs:
        - data/github-code-dependents
        - data/julia-registry/dependents.jsonl
        - data/github/clima_members.json
        - data/adopter-labels.csv
      outputs:
        - path: results/external-adopters.csv
          storage: git
        - path: results/adopter-accounts.csv
          storage: git
        - path: results/adopters-summary.json
          storage: git
        - path: figures/external-adopters.json
          storage: git
    analyze-jobs:
      description: >
        Group packages and CliMA papers into jobs to be done per
        config/jobs.yaml, then compare jobs on outside pull (accounts by
        the deepest funnel stage reached, users, contributors, and outside
        citations) against internal effort (CliMA members' merged PRs).
      kind: python-script
      script_path: scripts/analyze-jobs.py
      environment: analyze
      inputs:
        - config/jobs.yaml
        - scripts/clima_repos.py
        - results/github-engagement.csv
        - results/external-adopters.csv
        - results/external-citations.csv
        - data/openalex
        - data/github/prs
        - data/github/clima_members.json
      outputs:
        - path: results/jobs.csv
          storage: git
        - path: results/jobs-summary.json
          storage: git
        - path: figures/job-funnel.json
          storage: git
        - path: figures/job-scorecard.json
          storage: git
    analyze-usage:
      description: >
        Chart the accumulated usage snapshots: daily GitHub views and
        unique visitors per repo with blog posts marked, top referrers,
        average daily Julia installs per package (user vs. CI), Oceananigans
        installs against Julia peers, weekly user installs per package, and
        outside repos using CliMA
        packages by the year they were created.
      kind: python-script
      script_path: scripts/analyze-usage.py
      environment: analyze
      inputs:
        - scripts/repo_colors.py
        - scripts/clima_repos.py
        - data/github-traffic
        - data/julia-downloads
        - data/blog
        - data/github-code-dependents
        - results/external-adopters.csv
      outputs:
        - path: figures/repo-traffic.json
          storage: git
        - path: figures/repo-referrers.json
          storage: git
        - path: figures/julia-installs.json
          storage: git
        - path: figures/julia-installs-peers.json
          storage: git
        - path: figures/julia-installs-weekly.json
          storage: git
        - path: figures/repo-usage.json
          storage: git
    analyze-dev-speed:
      description: Analyze things like PR resolution speed to see changes over
        time.
      kind: jupyter-notebook
      notebook_path: notebooks/analyze-dev-speed.ipynb
      environment: analyze
      html_storage: git
      executed_ipynb_storage: git
      inputs:
        - scripts/repo_colors.py
        - scripts/clima_repos.py
        - data/github
      outputs:
        - path: results/dev-throughput.csv
          storage: git
        - path: figures/dev-throughput.json
          storage: git
    analyze-weekly:
      description: >
        Parse the mirrored weekly Buildkite logs into a table of scalar
        metrics (SYPD, walltime per coupling step, how far each run got
        before finishing or crashing, crash signature) and plot them over
        time.
      kind: jupyter-notebook
      notebook_path: notebooks/analyze-weekly.ipynb
      environment: analyze
      html_storage: git
      executed_ipynb_storage: git
      inputs:
        - from_stage_outputs: fetch-weekly-buildkite
      outputs:
        - path: results/weekly-benchmarks.csv
          storage: git
        - path: figures/weekly-benchmarks.json
          storage: git
    analyze-repo-changes:
      description: >
        Work out which clusters of CliMA packages change together, from the
        Project.toml commit history. Builds a layered dependency graph (an
        edge is read from commit messages that name the package that
        changed, e.g. "use ClimaCore v0.14.46"), a per-quarter co-change
        correlation of each package's commit counts, and the fraction of
        dependency updates that follow a release in another package within
        two weeks. Writes figures/repo-cochange.json and
        results/repo-cochange.csv.
      kind: python-script
      script_path: scripts/analyze-repo-changes.py
      environment: analyze
      inputs:
        - scripts/repo_colors.py
        - scripts/clima_repos.py
        - data/github
        - scripts/projecttoml-graph.py
      outputs:
        - path: results/repo-cochange.csv
          storage: git
        - path: results/repo-cochange-summary.json
          storage: git
        - path: figures/repo-cochange.json
          storage: git
    example-release-cascade:
      description: >
        Trace one concrete release cascade from the Project.toml history:
        the release with the widest downstream fan-out in the last two
        years, the dependency updates it triggered, and which of those
        packages then cut their own release. Writes
        results/example-release-cascade.json.
      kind: python-script
      script_path: scripts/example-release-cascade.py
      environment: analyze
      inputs:
        - data/github
        - scripts/projecttoml-graph.py
      outputs:
        - path: results/example-release-cascade.json
          storage: git
    estimate-colocation-saving:
      description: >
        Estimate how much dependency-propagation work co-locating tightly
        coupled packages into shared repos could remove. Counts cascade
        events (a dependency update following a release in another package
        within two weeks), splits them into mechanical compat/manifest
        bookkeeping versus substantive adaptation, and reports the
        mechanical share per year and per repo. Volume only: dependency
        updates already merge in well under a day, so the saving is in
        eliminated CI and review cycles, not wall-clock latency.
      kind: python-script
      script_path: scripts/estimate-colocation-saving.py
      environment: analyze
      inputs:
        - data/github
        - scripts/projecttoml-graph.py
      outputs:
        - path: results/colocation-saving.json
          storage: git
        - path: results/colocation-by-repo.csv
          storage: git
        - path: figures/colocation-saving.json
          storage: git
    summarize-amip-speedup:
      description: >
        Reduce the flagship AMIP results to the headline figures for the
        speedup question: the latest and recent-median speedup relative to
        the November 2025 baseline, plus the peak. Writes
        results/amip-speedup-summary.json.
      kind: python-script
      script_path: scripts/summarize-amip-speedup.py
      environment: analyze
      inputs:
        - results/amip.csv
      outputs:
        - path: results/amip-speedup-summary.json
          storage: git
    summarize-engagement:
      description: >
        Reduce the three external-engagement event streams (citations,
        GitHub engagement, new dependents) to per-quarter trend rates
        for the engagement question. Writes
        results/engagement-summary.json.
      kind: python-script
      script_path: scripts/summarize-engagement.py
      environment: analyze
      inputs:
        - results/external-citations.csv
        - results/github-engagement.csv
        - results/new-dependents.csv
      outputs:
        - path: results/engagement-summary.json
          storage: git
    summarize-dev-throughput:
      description: >
        Reduce the ecosystem-wide development-throughput aggregate to trend
        and first-versus-last figures for the throughput question. Writes
        results/dev-throughput-summary.json.
      kind: python-script
      script_path: scripts/summarize-dev-throughput.py
      environment: analyze
      inputs:
        - results/dev-throughput.csv
      outputs:
        - path: results/dev-throughput-summary.json
          storage: git

figures:
  - path: figures/amip-speedup.json
    title: Flagship AMIP speedup
    description: Flagship AMIP benchmark (16 horiz. elem.) SYPD over time
      normalized by the start of performance tracking.
    stage: analyze
  - path: figures/external-engagement.json
    title: External engagement
    description: External engagement with CliMA's products on a quarterly basis.
    stage: analyze-engagement
  - path: figures/external-engagement-monthly.json
    title: Monthly external engagement
    description: >
      The external engagement figure binned by month over the last 24
      months, including the current one (drawn lighter while in progress):
      paper citations, software paper citations, GitHub
      stars/forks/issues/PRs/discussions, and new outside repos depending
      on a CliMA package. Colors
      match the quarterly figure.
    stage: analyze-engagement
  - path: figures/github-engagement-weekly.json
    title: Weekly GitHub engagement
    description: >
      External GitHub stars, forks, opened issues, merged PRs, and
      discussions per week
      over the last 52 weeks, including the current one (drawn lighter
      while in progress), stacked by repo. Repo colors match the quarterly
      external engagement figure.
    stage: analyze-engagement
  - path: figures/repo-traffic.json
    title: GitHub traffic
    description: >
      Daily page views of CliMA repos stacked by repo, and daily unique
      visitors for the three most-viewed repos (the rest summed in gray),
      with blog post dates marked. GitHub keeps 14 days of traffic, so the
      series starts on 2026-10-21 and grows from there.
    stage: analyze-usage
  - path: figures/repo-referrers.json
    title: Repo traffic referrers
    description: >
      Where visitors to CliMA repos came from over the newest 14-day
      window, as unique visitors summed over repos. GitHub reports only
      each repo's top 10 referrers.
    stage: analyze-usage
  - path: figures/julia-installs.json
    title: Julia installs by package
    description: >
      Average daily unique IP addresses installing each CliMA package from
      the Julia package servers over the last 28 days, split into user and
      CI clients and ranked by user installs. Packages pulled in by other
      packages count too.
    stage: analyze-usage
  - path: figures/julia-installs-peers.json
    title: Oceananigans installs vs. Julia peers
    description: >
      Daily user (non-CI) installs of Oceananigans next to SpeedyWeather
      and Trixi, from the Julia package servers.
    stage: analyze-usage
  - path: figures/julia-installs-weekly.json
    title: Weekly Julia user installs of CliMA packages
    description: >
      Average daily user (non-CI) installs per week for each CliMA package
      averaging at least 5 a day, one panel each with its own scale, with
      blog posts featuring the package marked. The package servers keep
      only 31 days, so the history starts when this pipeline first fetched
      them (October 2026) and grows daily.
    stage: analyze-usage
  - path: figures/repo-usage.json
    title: Outside repos using CliMA packages
    description: >
      Public repos outside CliMA whose Project.toml lists a CliMA package
      (from the weekly code search, with CliMA members, spin-offs, and
      copies excluded), by the year the repo was created and whether it was
      pushed to in the last 180 days.
    stage: analyze-usage
  - path: figures/external-adopters.json
    title: External adopters by package
    description: >
      Distinct GitHub accounts outside CliMA with a repo that lists each
      CliMA package as a direct dependency in its Project.toml (from code
      search and the Julia registry), stacked by segment from their public
      profiles. CliMA members, spin-offs run by CliMA developers
      (NumericalEarth), and copies of CliMA repos aren't counted. The ESM
      components (ClimaAtmos, ClimaLand, ClimaCoupler) always get a row.
    stage: analyze-adopters
  - path: figures/blog-post-engagement.json
    title: GitHub activity after blog posts
    description: >
      For each post in the blog's package series (since 2026-07-28) that
      names a tracked package, the package's external GitHub events (stars,
      forks, opened issues, merged PRs, discussions) in the 28 days from the
      post, next to the count its rate over the prior
      90 days predicts. Oceananigans has its own panel because its activity
      is about ten times any other package's. Posts less than 28 days old
      are compared over the days so far.
    stage: analyze-blog
  - path: figures/weekly-benchmarks.json
    title: Weekly benchmarks
    stage: analyze-weekly
    description: >
      Scalar metrics over time for the weekly ClimaCoupler and ClimaLand
      benchmark runs. One trace per active configuration. Panels are throughput (SYPD),
      the fraction of
      the configured run length actually simulated (crosses mark jobs that
      did not pass, so a low value reads as a crash), and job wallclock.
  - path: figures/dev-throughput.json
    title: Software development throughput
    stage: analyze-dev-speed
    description: Quarterly development throughput across CliMA's ecosystem. Pull
      request time-to-merge (p50 and p90), PR merge rate, and release rate.
      There is one trace per repository; the thick gray line is the
      ecosystem-wide value (normalized to a per-repo average on the count-based
      panels).
  - path: figures/repo-cochange.json
    title: Repo co-change clusters
    stage: analyze-repo-changes
    description: >
      Which CliMA packages change together, as a Sankey dependency graph
      built from Project.toml commit messages. Dependents are on the left
      and their dependencies on the right, with link width by how much
      evidence the history gives for that link. Package-level thresholds
      and timings behind it are in results/repo-cochange.csv.
  - path: figures/colocation-saving.json
    title: Release burden and reach by repo
    stage: estimate-colocation-saving
    description: >
      Releases per repo since it was first tagged, with the upstream-driven
      (reactive) share overlaid and the number of external Julia-registry
      dependents annotated at the right. Shows which packages carry the
      release/Registrator/propagation burden and how many users outside
      CliMA that burden actually serves.

  - path: figures/job-funnel.json
    title: Outside accounts by job and funnel stage
    description: >
      Distinct GitHub accounts outside CliMA engaging with each job to be
      done's repos over the last two years, each at the deepest stage it
      reached: watcher (star or fork), asker (issue or discussion), user (a
      public repo depending on the job's packages), or contributor (a
      merged PR). Jobs served only by papers have no funnel.
    stage: analyze-jobs
  - path: figures/job-scorecard.json
    title: Effort and outside pull by job to be done
